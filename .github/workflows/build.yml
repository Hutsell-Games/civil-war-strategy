# Builds the game (cws.bas) with QB64Rust on Windows, then runs its tests (tests/README.md):
# the Python and unit tests on Windows, the whole-game scripts on Linux. The result is an
# artifact named civil-war-strategy: cws.exe with the data files it reads, ready to unzip and
# play. It is uploaded before the tests run, so a failing test still leaves the build to look at.
name: Build

# When something reaches main (a merge or a push to it), or by hand with "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The QB64Rust commit the game is built with. Change it to take a newer compiler.
  QB64RUST_REF: main

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Keep the files' bytes as committed: the runner's default would turn LF into CR LF.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          path: game

      - uses: actions/checkout@v7
        with:
          repository: davidshq/QB64Rust
          ref: ${{ env.QB64RUST_REF }}
          path: qb64rust

      # Installs the Rust toolchain named in QB64Rust's rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: qb64rust

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qb64rust

      - run: cargo build --release --locked
        working-directory: qb64rust

      # The C++ toolchain qb64rust builds with (llvm-mingw, a 190 MB download). Its version is
      # pinned in toolchain.rs, so the cache is kept until that file changes.
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\qb64rust\toolchain
          key: qb64rust-toolchain-${{ hashFiles('qb64rust/crates/driver/src/toolchain.rs') }}

      - run: qb64rust\target\release\qb64rust.exe toolchain install

      # The build takes the name of the DOS program. It is made in a folder of its own, so that
      # it does not matter whether the DOS program CWS.EXE is still in the repo.
      - name: Build the game
        working-directory: game
        run: |
          New-Item -ItemType Directory ..\dist | Out-Null
          ..\qb64rust\target\release\qb64rust.exe -x cws.bas -o ..\dist\cws.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The program, the two files it needs beside it (its settings and its Hall of Fame), the
      # data folders (FOLDERS.BI), and the game's own documents in docs. Sources, DOS programs
      # and the developer notes are left out.
      - name: Put the playable folder together
        run: |
          Copy-Item game\CWS.CFG, game\HISCORE.CWS, game\README.md, game\CHANGELOG.md, game\LICENSE -Destination dist
          Copy-Item game\graphics, game\scenarios -Destination dist -Recurse
          New-Item -ItemType Directory dist\docs | Out-Null
          Copy-Item game\docs\CWS.DOC, game\docs\CWSDOC.TXT -Destination dist\docs

      - uses: actions/upload-artifact@v7
        with:
          name: civil-war-strategy
          path: dist
          if-no-files-found: error

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The tests of play.py and make_scripts.py, and the folder rules.
      - name: Python tests
        working-directory: game
        run: python -m unittest discover -s tests -p "test_*.py"

      # The SUBs that draw nothing, called from tests/rules_test.bas.
      - name: Unit tests
        working-directory: game
        run: |
          ..\qb64rust\target\release\qb64rust.exe test tests\rules_test.bas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The whole-game scripts against their recorded screens, on Linux. On the Windows runner every
  # script hung before the title menu (2026-11-14, the first run on main), most likely at the
  # first sound statement: the runner has no sound device. QB64Rust's own CI runs its window
  # programs the same way: on Linux, under Xvfb, with ALSA's null device, which play.py sets for
  # each run (tests/README.md, "Running on Linux"). One game at a time, as the README says.
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: game

      - uses: actions/checkout@v7
        with:
          repository: davidshq/QB64Rust
          ref: ${{ env.QB64RUST_REF }}
          path: qb64rust

      # The system C++ toolchain and libraries qb64rust builds with on Linux, and Xvfb for the
      # window. The list is that of QB64Rust's Linux job (its .github/workflows/rust.yml).
      - name: Install the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglu1-mesa-dev libasound2-dev libpng-dev libcurl4-openssl-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev xvfb

      - run: rustup toolchain install
        working-directory: qb64rust

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qb64rust

      - run: cargo build --release --locked
        working-directory: qb64rust

      - name: Whole-game scripts
        working-directory: game
        env:
          CWS_QB64RUST_REPO: ${{ github.workspace }}/qb64rust
        run: xvfb-run -a python3 tests/play.py check

      # A failed script leaves the screens that differ, as PNGs, what play.py printed, and each
      # run's own log.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-failures
          path: |
            game/tests/out/fail
            game/tests/out/last-*.txt
            game/tests/out/run/*/log.txt
          if-no-files-found: ignore
