# Settings of QB64Rust for this program (QB64Rust's docs\MANUAL.md, "The settings file").

# The layout of `qb64rust -y` and of Format Document in VS Code: four spaces a level, with the body of a SUB or
# FUNCTION one level in, each single-line IF written as a block IF with END IF, and one statement a line.
# Format an include file inside its program: `qb64rust -y commands/army.bm --program cws.bas -o commands/army.bm`.
[format]
keyword-case = "upper"
block-if = true
one-statement-per-line = true
